<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>도트 아트 평가</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a10; color: #e8e6f0; font: 13px system-ui, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #bar { position: fixed; left: 0; right: 0; top: 0; height: 44px; display: flex; gap: 14px; align-items: center; padding: 0 12px; background: #17141f; border-bottom: 1px solid #2d2b3a; box-sizing: border-box; }
    .g { display: flex; gap: 4px; align-items: center; color: #9a97ab; }
    button { font: 600 12px system-ui, sans-serif; color: #e8e6f0; background: #262433; border: 1px solid #3a3850; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
    button.on { background: #2f4a7a; border-color: #7aa7ff; }
    #desc { color: #c9c4dc; }
    #hint { position: fixed; left: 12px; bottom: 8px; color: #8f8aa3; pointer-events: none; }
    #turn { display: none; position: fixed; inset: 0; background: #0c0a10; color: #fff; font-size: 18px; align-items: center; justify-content: center; text-align: center; z-index: 9; }
    @media (orientation: portrait) and (max-width: 700px) { #turn { display: flex; } }
    @media (max-height: 500px) {
      #bar { height: 30px; gap: 8px; padding: 0 6px; background: rgba(23, 20, 31, 0.7); border: 0; width: max-content; border-radius: 0 0 8px 0; }
      #desc { display: none; } button { padding: 2px 7px; font-size: 11px; }
      #hint { display: none; } #hint.touch { display: block; font-size: 10px; bottom: 2px; left: 6px; }
    }
    #load { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="g">속도 <button data-speed="1" class="on">1x</button><button data-speed="0.5">0.5x</button><button data-speed="0.25">0.25x</button></div>
    <div class="g"><button id="pts">판정점</button><button id="full">전체 화면</button></div>
    <span id="desc">1층 · 해골 전사 10 + 오크 전사 1 · 죽으면 1초 뒤 다시 나옴 · 판정은 탑뷰, 그림은 3/4</span>
  </div>
  <div id="hint">좌클릭(누르고 끌기): 이동 · 가까운 적은 마우스 방향으로 자동 공격 · 우클릭 또는 빠르게 튕기기: 돌진 베기(적을 뚫고 지나감, 최대 4연쇄) · 오크 범위가 빨갛고 "!"일 때 맞히면 반격</div>
  <script>if (matchMedia('(pointer: coarse)').matches) { const h = document.getElementById('hint'); h.className = 'touch'; h.textContent = '누르고 끌기: 이동(진행 방향으로 자동 공격) · 빠르게 튕기기: 돌진 베기 · 오크 "!"일 때 맞히면 반격'; }</script>
  <div id="turn">가로로 돌려 주세요</div>
  <div id="load">불러오는 중</div>
  <script>
    // Android/desktop: real fullscreen. iPhone Safari has no page fullscreen: "공유 > 홈 화면에 추가" opens it without browser bars
    const fb = document.getElementById('full'), de = document.documentElement;
    if (!(de.requestFullscreen || de.webkitRequestFullscreen) || navigator.standalone) fb.style.display = 'none';
    fb.onclick = () => document.fullscreenElement ? document.exitFullscreen() : (de.requestFullscreen || de.webkitRequestFullscreen).call(de).then?.(() => screen.orientation?.lock?.('landscape').catch(() => {}));
  </script>
  <script type="module" src="game.js?v=3"></script>
</body>
</html>
