<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>이펙트·모션 확인</title>
  <style>
    :root { --bg: #111017; --card: #1b1a24; --line: #2d2b3a; --text: #e8e6f0; --muted: #9a97ab; --accent: #7aa7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: rgba(17,16,23,.94); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    h1 { font-size: 16px; margin: 0 8px 0 0; }
    .grp { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; }
    button { font: 600 13px system-ui, sans-serif; color: var(--text); background: #262433; border: 1px solid #3a3850; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    button.on { background: #2f4a7a; border-color: var(--accent); }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 16px; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .card canvas { display: block; width: 100%; aspect-ratio: 8 / 5; image-rendering: pixelated; image-rendering: crisp-edges; background: #2a2531; }
    .card h2 { font-size: 14px; margin: 8px 12px 0; }
    .card p { margin: 2px 12px 10px; color: var(--muted); font-size: 12px; }
    .err { color: #f88; padding: 16px; white-space: pre-wrap; font: 12px monospace; }
  </style>
</head>
<body>
  <header>
    <h1>이펙트·모션 확인</h1>
    <div class="grp">주인공 <span id="heroes"></span></div>
    <div class="grp">속도 <button data-speed="1" class="on">1x</button><button data-speed="0.5">0.5x</button><button data-speed="0.25">0.25x</button></div>
    <div class="grp">이펙트 <button id="fx" class="on">켬</button></div>
  </header>
  <main id="cards"></main>
  <script type="module" src="lab.js"></script>
</body>
</html>
